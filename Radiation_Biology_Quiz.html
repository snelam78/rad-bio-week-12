<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radiation Biology Practice Quiz</title>
<style>
  :root { color-scheme: light; font-family: system-ui, sans-serif; color: #10373c; background: #d9f9f4; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  header { background: #086c6b; color: white; border-bottom: 6px solid #ff887a; }
  .wrap { width: min(100% - 2rem, 48rem); margin: auto; }
  header .wrap { padding: 1.6rem 0; }
  h1 { margin: 0; font-size: clamp(1.55rem, 4vw, 2.4rem); letter-spacing: -.035em; }
  main { padding: 1.5rem 0 3rem; }
  .progress-line, .actions { display: flex; align-items: center; justify-content: space-between; gap: .6rem; flex-wrap: wrap; }
  .progress-line { font-size: .9rem; font-weight: 650; }
  progress { width: 100%; height: .65rem; border: 0; border-radius: 1rem; background: #b5e5df; margin: .65rem 0 1.15rem; }
  progress::-webkit-progress-bar { border-radius: 1rem; background: #b5e5df; }
  progress::-webkit-progress-value { border-radius: 1rem; background: #086c6b; }
  progress::-moz-progress-bar { border-radius: 1rem; background: #086c6b; }
  .card { padding: clamp(1rem, 4vw, 2rem); background: #fff; border: 1px solid #a9dfd8; border-radius: 1rem; }
  h2 { font-size: clamp(1.3rem, 4vw, 1.85rem); line-height: 1.24; font-weight: 850; margin: 0 0 1rem; }
  button { font: inherit; color: inherit; cursor: pointer; border: 1px solid #95d6ce; border-radius: .65rem; padding: .7rem .9rem; background: #effbf9; }
  button:focus-visible { outline: 3px solid #075e5d; outline-offset: 3px; }
  button:disabled { opacity: .55; cursor: default; }
  .option { display: flex; align-items: center; text-align: left; gap: .75rem; width: 100%; margin: .55rem 0; }
  .option b { flex: 0 0 1.85rem; text-align: center; padding: .2rem; background: #c3f2ea; border-radius: .35rem; }
  .option[aria-pressed="true"], .option:hover:not(:disabled) { border-color: #086c6b; background: #d3f5ef; }
  .option.correct { border-color: #086c6b; background: #c3f2ea; opacity: 1; }
  .option.incorrect { border-color: #ae564a; background: #ffe4df; opacity: 1; }
  .feedback { margin: 1rem 0; line-height: 1.5; }
  .actions { margin-top: 1.2rem; }
  .primary { background: #ff9384; border-color: #ff9384; color: #3d2525; font-weight: 750; }
  footer { margin-top: 1rem; display: flex; justify-content: flex-end; }
  #restart { background: transparent; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header><div class="wrap"><h1>Radiation Biology Practice Quiz</h1></div></header>
<main class="wrap">
  <div class="progress-line"><span id="position"></span><span id="saved" role="status"></span></div>
  <progress id="progress" max="100" value="0" aria-label="Questions answered"></progress>
  <section class="card" aria-labelledby="question">
    <h2 id="question" tabindex="-1"></h2>
    <div id="options" role="group" aria-labelledby="question"></div>
    <p class="feedback" id="feedback" aria-live="polite" hidden></p>
    <div class="actions">
      <button id="back" type="button">Previous</button>
      <button id="advance" class="primary" type="button">Check answer</button>
    </div>
  </section>
  <footer><button id="restart" type="button">Restart quiz</button></footer>
</main>
<script>
"use strict";
const questions = [["What is the primary goal of radiation therapy?", ["Eradicate tumor while limiting normal tissue injury", "Prevent every cell from dividing", "Deliver the maximum possible dose", "Eliminate the need for tissue tolerance estimates"], 0, "Treatment seeks tumor control while protecting normal tissues. Maximum dose alone does not achieve that balance. Reference: R 3."], ["What does TD 5/5 describe?", ["5 Gy in 5 fractions", "5% complication risk within 5 years", "5% survival after 5 days", "50% complication risk within 5 years"], 1, "The first 5 is the complication percentage and the second is years; neither is a fraction number. Reference: W12."], ["What does TD 50/5 describe?", ["50% cell survival after 5 fractions", "50% complication risk within 5 years", "5% complication risk within 50 years", "50 Gy in 5 treatments"], 1, "TD 50/5 concerns a tissue complication endpoint, not surviving fraction. Reference: W12."], ["Which factor must accompany an organ tolerance dose?", ["Patient room number", "Volume of the organ irradiated", "Detector brand", "Laser color"], 1, "Larger irradiated volumes generally increase complication risk. The historical table distinguishes partial and whole organ exposure. Reference: T 6–9."], ["Which fraction schedule was used for the historical Emami estimates?", ["1000 cGy daily", "180–200 cGy daily on 5 days per week", "10 cGy once a month", "One 20 Gy exposure"], 1, "The estimates apply to conventional fractionation; changing the schedule changes biological response. Reference: T 6."], ["Which describes a deterministic effect?", ["Severity generally increases above a threshold", "It has no threshold in the course model", "It is always inherited", "Severity is unrelated to dose"], 0, "Large cell loss produces tissue dysfunction. A no threshold cancer model describes stochastic risk. Reference: T 4–5."], ["Which describes radiation induced cancer?", ["A form of normal tissue regeneration", "A deterministic reaction with dose related severity", "A stochastic effect with dose related probability", "A guaranteed event at every dose"], 2, "Stochastic probability increases with dose, while severity is not set by the initiating dose. Reference: T 5."], ["Why can fractionation improve the treatment balance?", ["It eliminates normal tissue exposure", "It permits repair and other biological changes between treatments", "It stops all tumor repopulation", "It makes oxygen irrelevant"], 1, "Repair, reoxygenation and redistribution can help the response, while repopulation may help normal tissue or oppose tumor control. Reference: R 4–10."], ["Which R describes correction of sublethal damage between fractions?", ["Repopulation", "Redistribution", "Repair", "Reoxygenation"], 2, "Repair corrects molecular injury; repopulation makes new cells. Reference: R 6."], ["If fractions are too close for adequate repair, what may happen?", ["Unrepaired damage can accumulate", "All cells become protected", "Only tumor cells repair faster", "Dose disappears between fractions"], 0, "Incomplete repair can increase biological effect and toxicity. Less time does not improve repair. Reference: R 6–8."], ["Which R describes previously hypoxic cells gaining oxygen?", ["Radiosensitivity", "Reoxygenation", "Repair", "Repopulation"], 1, "Blood flow recovery and reduced diffusion distance can increase tumor oxygen availability. Reference: R 9–10."], ["Temporary closure of a tumor blood vessel causes which type of hypoxia?", ["Chronic diffusion limited hypoxia", "Complete reoxygenation", "Acute hypoxia", "Redistribution"], 2, "Acute hypoxia involves changing perfusion; chronic hypoxia reflects persistent oxygen diffusion limits. Reference: R 9–10."], ["Which change can improve chronic tumor oxygenation?", ["Permanent vessel closure", "Tumor shrinkage brings cells closer to blood supply", "Removing all dissolved oxygen", "Increasing diffusion distance"], 1, "Shorter diffusion distances can allow oxygen to reach previously hypoxic surviving cells. Reference: R 9–10."], ["Which R describes progression into different cell cycle phases?", ["Reoxygenation", "Repopulation", "Redistribution", "Repair"], 2, "Redistribution changes phase, while repopulation changes cell number. Reference: R 6; W12."], ["Which phase is most radiosensitive in the course discussion?", ["Every phase equally", "Only G1", "Late S phase", "Mitosis"], 3, "Mitosis and the G2/M region are sensitive; late S is relatively resistant. Reference: Earlier cell cycle discussion; W12."], ["When does redistribution help a later fraction?", ["Every cell stops cycling permanently", "Survivors enter a more sensitive phase", "Every survivor stays in S phase", "All radiation damage is reversed"], 1, "Progression toward G2/M can increase sensitivity; remaining in resistant S phase does not provide this benefit. Reference: R 6; W12."], ["Which describes repopulation?", ["Only chemical DNA repair", "Division of surviving cells", "A change in LET", "Increased oxygen fixation"], 1, "Repopulation increases cell number. Both tumor and normal tissue can repopulate. Reference: R 8."], ["Why can tumor repopulation oppose treatment?", ["It guarantees normal tissue recovery", "It replaces some tumor cells that were killed", "It lowers the prescribed physical dose", "It prevents cell division"], 1, "Tumor replacement increases the population that still needs to be controlled. Reference: R 8; W12."], ["What is a benefit of normal tissue repopulation?", ["Removal of all DNA injury immediately", "Increased tumor resistance alone", "Elimination of hypoxia in every tumor", "Replacement of lost normal cells"], 3, "Normal replacement can reduce acute toxicity; it is not instantaneous DNA repair. Reference: R 8."], ["What does inherent radiosensitivity describe?", ["Only the number of fractions", "Baseline cellular susceptibility to radiation", "Only oxygen concentration", "Only the machine output"], 1, "Cell type and intrinsic biology influence response before other treatment conditions are considered. Reference: R 11; W12."], ["Which group is generally most radiosensitive?", ["Highly specialized resting cells", "Rapidly dividing undifferentiated cells", "All cells equally", "Mature nondividing nerve cells"], 1, "The Bergonié and Tribondeau relationship emphasizes active mitosis, lack of differentiation and a long mitotic future. Reference: Earlier law discussion; W12."], ["Which population normally rests but can resume division?", ["VIM", "FPM", "RPM", "DIM"], 2, "Reverting postmitotic cells retain division potential. FPM cells are fixed postmitotic. Reference: Earlier cell population discussion."], ["What does a larger Dq generally indicate?", ["No DNA damage at any lower dose", "A guaranteed steep terminal slope", "Greater capacity to accumulate and repair sublethal damage", "A lower prescribed dose"], 2, "Dq characterizes shoulder width. It is not a true no effect threshold and does not alone set D0. Reference: C 9; W12."], ["A population has a small D0. Which response is expected?", ["A compulsory larger shoulder", "Steep terminal slope and greater sensitivity", "Shallow slope and greater resistance", "No loss of survival"], 1, "A smaller dose increment produces the same factor of survival reduction. Reference: C 10; W12."], ["An increment of one D0 on the exponential segment changes 10% survival to approximately what?", ["37%", "63%", "3.7%", "0%"], 2, "D0 reduces the current surviving fraction by a factor of about 0.37, not to 37% absolute survival from every starting point. Reference: W12 D0 definition."], ["Which is the traditional extrapolation or target number?", ["n", "LET", "Dq", "OER"], 0, "n comes from extrapolating the terminal portion back to the vertical axis; course values are 2–10. Reference: C 8; W12."], ["Which is a physical influence on a survival curve?", ["Cell cycle phase", "LET", "DNA repair capacity", "Oxygen"], 1, "LET describes radiation quality. Oxygen is chemical; cell phase and repair are biological. Reference: C 13; W12."], ["Which is a chemical influence on a survival curve?", ["A free radical scavenging radioprotector", "Cell type", "Cell cycle phase", "Dose rate"], 0, "A chemical protector can reduce radical damage. Dose rate is physical, while cell properties are biological. Reference: C 13; W12."], ["Compared with low LET, high LET usually produces which curve?", ["Smaller shoulder and steeper decline", "Larger shoulder and shallower decline", "An oxygen dependent shoulder only", "No cell killing"], 0, "Dense ionization produces clustered damage that is harder to repair. Reference: Earlier LET discussion; W12."], ["How does RBE generally change as LET rises toward 100 keV/µm?", ["It increases", "It becomes identical to OER", "It always decreases", "It remains exactly 1"], 0, "Biological effectiveness rises toward the peak; beyond it, overkill can reduce RBE. Reference: Earlier LET and RBE discussion."], ["What happens to OER as LET becomes high?", ["It equals Dq", "It approaches 1", "It rises without limit", "It measures fraction size"], 1, "High LET damage depends less on oxygen, narrowing the dose difference between hypoxic and oxygenated cells. Reference: Earlier OER discussion."], ["Why does oxygen sensitize cells to low LET radiation?", ["It removes the need for absorbed dose", "It repairs all double strand breaks", "It helps fix radiation induced radical damage", "It prevents radiolysis"], 2, "Molecular oxygen makes some radical damage harder to reverse; it does not act as a DNA repair agent. Reference: Earlier oxygen discussion; W12."], ["A drug reduces free radical damage in a tumor. Which response is expected if the tumor is protected?", ["No possible curve change", "A mandatory increase in LET", "Higher survival at the same dose", "Lower survival at the same dose"], 2, "Radioprotection shifts response toward greater survival, unlike sensitization. Reference: C 13; earlier question 15."], ["Which DNA injury is generally hardest to repair correctly?", ["An undamaged chromosome", "An isolated repairable single strand break", "Clustered double strand breaks", "A normal complementary base pair"], 2, "Both strands and nearby lesions make correct restoration more difficult. Reference: Earlier DNA discussion."], ["What happens first in the common indirect low LET damage pathway?", ["Radiation generated electrons interact with water", "DNA must divide before any energy is deposited", "Oxygen repairs DNA", "All chromosomes form rings"], 0, "Water radiolysis generates reactive species that can later attack DNA. Reference: Earlier radiolysis discussion."], ["A large shoulder is followed by a steep exponential decline. What does this suggest?", ["The curve cannot describe mammalian cells", "No damage occurred in the shoulder", "Early damage can be tolerated or repaired, then survival drops rapidly as dose increases", "The population is resistant at every dose"], 2, "The shoulder and terminal slope describe related but distinct response features. Reference: C 9–10; W12."], ["What widens the therapeutic window?", ["Ignoring treatment volume", "More normal tissue injury at unchanged tumor control", "Identical responses at every dose", "Greater separation of tumor control and normal tissue complication responses"], 3, "A wider separation permits tumor control with a lower complication risk. Reference: R 13."], ["According to the lecture TD 5/5 list, what is the value for bone marrow?", ["70 Gy", "2.5 Gy", "10 Gy", "55 Gy"], 1, "The lecture lists 2.5 Gy for bone marrow. Endpoint: suppression; lecture teaching value. The other doses belong to different tissue entries. Reference: T 7–9 and 13–14; R 16–17."], ["According to the lecture TD 5/5 list, what is the value for lens?", ["55 Gy", "47 Gy", "17.5 Gy", "10 Gy"], 3, "The lecture lists 10 Gy for lens. Endpoint: cataract. The other doses belong to different tissue entries. Reference: T 7–9 and 13–14; R 16–17."], ["According to the lecture TD 5/5 list, what is the value for lung?", ["70 Gy", "17.5 Gy", "10 Gy", "40 Gy"], 1, "The lecture lists 17.5 Gy for lung. Endpoint: pneumonitis. The other doses belong to different tissue entries. Reference: T 7–9 and 13–14; R 16–17."], ["According to the lecture TD 5/5 list, what is the value for kidney?", ["70 Gy", "23 Gy", "50 Gy", "45 Gy"], 1, "The lecture lists 23 Gy for kidney. Endpoint: nephritis. The other doses belong to different tissue entries. Reference: T 7–9 and 13–14; R 16–17."], ["According to the lecture TD 5/5 list, what is the value for liver?", ["45 Gy", "52 Gy", "10 Gy", "30 Gy"], 3, "The lecture lists 30 Gy for liver. Endpoint: liver failure. The other doses belong to different tissue entries. Reference: T 7–9 and 13–14; R 16–17."], ["According to the lecture TD 5/5 list, what is the value for parotid?", ["23 Gy", "52 Gy", "60 Gy", "32 Gy"], 3, "The lecture lists 32 Gy for parotid. Endpoint: xerostomia. The other doses belong to different tissue entries. Reference: T 7–9 and 13–14; R 16–17."], ["According to the lecture TD 5/5 list, what is the value for small intestine?", ["60 Gy", "47 Gy", "65 Gy", "40 Gy"], 3, "The lecture lists 40 Gy for small intestine. Endpoint: obstruction or perforation. The other doses belong to different tissue entries. Reference: T 7–9 and 13–14; R 16–17."], ["According to the lecture TD 5/5 list, what is the value for heart?", ["2.5 Gy", "60 Gy", "50 Gy", "40 Gy"], 3, "The lecture lists 40 Gy for heart. Endpoint: pericarditis. The other doses belong to different tissue entries. Reference: T 7–9 and 13–14; R 16–17."], ["According to the lecture TD 5/5 list, what is the value for brain?", ["65 Gy", "60 Gy", "47 Gy", "45 Gy"], 3, "The lecture lists 45 Gy for brain. Endpoint: necrosis or infarction. The other doses belong to different tissue entries. Reference: T 7–9 and 13–14; R 16–17."], ["According to the lecture TD 5/5 list, what is the value for retina?", ["45 Gy", "65 Gy", "47 Gy", "23 Gy"], 0, "The lecture lists 45 Gy for retina. Endpoint: blindness. The other doses belong to different tissue entries. Reference: T 7–9 and 13–14; R 16–17."], ["According to the lecture TD 5/5 list, what is the value for thyroid?", ["32 Gy", "45 Gy", "30 Gy", "60 Gy"], 1, "The lecture lists 45 Gy for thyroid. Endpoint: endpoint not specified in dose list. The other doses belong to different tissue entries. Reference: T 7–9 and 13–14; R 16–17."], ["According to the lecture TD 5/5 list, what is the value for colon?", ["52 Gy", "45 Gy", "23 Gy", "50 Gy"], 1, "The lecture lists 45 Gy for colon. Endpoint: obstruction or perforation. The other doses belong to different tissue entries. Reference: T 7 and 19."], ["According to the lecture TD 5/5 list, what is the value for spinal cord?", ["40 Gy", "47 Gy", "70 Gy", "30 Gy"], 1, "The lecture lists 47 Gy for spinal cord. Endpoint: myelitis or necrosis. The other doses belong to different tissue entries. Reference: T 7–9 and 13–14; R 16–17."], ["According to the lecture TD 5/5 list, what is the value for brainstem?", ["50 Gy", "23 Gy", "47 Gy", "30 Gy"], 0, "The lecture lists 50 Gy for brainstem. Endpoint: necrosis or infarction. The other doses belong to different tissue entries. Reference: T 7–9 and 13–14; R 16–17."], ["According to the lecture TD 5/5 list, what is the value for optic nerve or chiasm?", ["17.5 Gy", "52 Gy", "47 Gy", "50 Gy"], 3, "The lecture lists 50 Gy for optic nerve or chiasm. Endpoint: blindness. The other doses belong to different tissue entries. Reference: T 7–9 and 13–14; R 16–17."], ["According to the lecture TD 5/5 list, what is the value for stomach?", ["50 Gy", "30 Gy", "55 Gy", "60 Gy"], 0, "The lecture lists 50 Gy for stomach. Endpoint: ulceration or perforation. The other doses belong to different tissue entries. Reference: T 7–9 and 13–14; R 16–17."], ["According to the lecture TD 5/5 list, what is the value for femoral heads?", ["55 Gy", "52 Gy", "2.5 Gy", "47 Gy"], 1, "The lecture lists 52 Gy for femoral heads. Endpoint: necrosis. The other doses belong to different tissue entries. Reference: T 7–9 and 13–14; R 16–17."], ["According to the lecture TD 5/5 list, what is the value for esophagus?", ["52 Gy", "55 Gy", "60 Gy", "50 Gy"], 1, "The lecture lists 55 Gy for esophagus. Endpoint: stricture or perforation. The other doses belong to different tissue entries. Reference: T 7–9 and 13–14; R 16–17."], ["According to the lecture TD 5/5 list, what is the value for skin?", ["17.5 Gy", "40 Gy", "65 Gy", "55 Gy"], 3, "The lecture lists 55 Gy for skin. Endpoint: necrosis or ulceration. The other doses belong to different tissue entries. Reference: T 7–9 and 13–14; R 16–17."], ["According to the lecture TD 5/5 list, what is the value for rectum?", ["10 Gy", "60 Gy", "65 Gy", "55 Gy"], 1, "The lecture lists 60 Gy for rectum. Endpoint: proctitis, necrosis, fistula or stenosis. The other doses belong to different tissue entries. Reference: T 7–9 and 13–14; R 16–17."], ["According to the lecture TD 5/5 list, what is the value for brachial plexus?", ["50 Gy", "40 Gy", "55 Gy", "60 Gy"], 3, "The lecture lists 60 Gy for brachial plexus. Endpoint: nerve damage. The other doses belong to different tissue entries. Reference: T 7–9 and 13–14; R 16–17."], ["According to the lecture TD 5/5 list, what is the value for bladder?", ["65 Gy", "70 Gy", "60 Gy", "17.5 Gy"], 0, "The lecture lists 65 Gy for bladder. Endpoint: contracture. The other doses belong to different tissue entries. Reference: T 7–9 and 13–14; R 16–17."], ["According to the lecture TD 5/5 list, what is the value for larynx?", ["52 Gy", "10 Gy", "50 Gy", "70 Gy"], 3, "The lecture lists 70 Gy for larynx. Endpoint: necrosis. The other doses belong to different tissue entries. Reference: T 7–9 and 13–14; R 16–17."], ["Which R describes sublethal DNA damage correction between fractions?", ["Redistribution", "Repair", "Repopulation", "Reoxygenation"], 1, "Repair may take place between fractions. Source: Week 12 study guide and lecture recap."], ["A surviving tumor cell moves from late S phase into mitosis. Which R does this illustrate?", ["Redistribution", "Repair", "Radiosensitivity", "Reoxygenation"], 0, "Redistribution describes movement through the cell cycle. Source: Week 12 study guide and lecture recap."], ["Which R accounts for replacement of cells through division?", ["Repair", "Redistribution", "Reoxygenation", "Repopulation"], 3, "Surviving cells can divide and increase cell number. Source: Week 12 study guide and lecture recap."], ["Which R reflects an inherent difference between two cell types given the same exposure?", ["Repair", "Reoxygenation", "Radiosensitivity", "Redistribution"], 2, "Radiosensitivity is the inherent susceptibility to radiation. Source: Week 12 study guide and lecture recap."], ["How can tumor shrinkage promote reoxygenation?", ["Surviving cells lose their ability to divide", "Surviving cells can be closer to the blood supply", "The blood loses dissolved oxygen", "The radiation changes from low to high LET"], 1, "A shorter oxygen diffusion distance can improve oxygenation. Source: Week 12 study guide and lecture recap."], ["What can make acute tumor hypoxia resolve quickly?", ["A temporarily closed blood vessel reopens", "Scar tissue replaces the tumor", "Cells enter S phase", "A double-strand break is repaired"], 0, "Restored perfusion can quickly supply oxygen. Source: Week 12 study guide and lecture recap."], ["A viable cell remains far from a blood vessel. Which explanation best fits its persistent hypoxia?", ["A temporary change in blood flow", "Sublethal damage repair", "High intrinsic radiosensitivity", "Limited oxygen diffusion"], 3, "Chronic hypoxia reflects limited diffusion. Source: Week 12 study guide and lecture recap."], ["What can happen if treatment is prolonged enough for surviving cancer cells to divide?", ["Tumor LET increases", "The tumor permanently loses its blood supply", "Tumor cell number can recover through repopulation", "Dq becomes the total dose"], 2, "Tumor repopulation can counteract cell killing. Source: Week 12 study guide and lecture recap."], ["Which normal tissue would typically show earlier repopulation?", ["Late-responding connective tissue", "Oropharyngeal mucosa", "Mature nerve tissue", "Late-responding endothelium"], 1, "Acute-responding mucosa has relatively rapid cell turnover. Source: Week 12 study guide and lecture recap."], ["Which event can cause a temporarily hypoxic tumor cell to respond more strongly to a later low-LET fraction?", ["Reoxygenation before the later fraction", "Loss of blood flow before the later fraction", "Movement into late S phase", "Repair of prior sublethal damage"], 0, "Oxygen increases the effectiveness of low-LET radiation. Source: Week 12 study guide and lecture recap."], ["What is shown on the horizontal axis of the cell survival curve?", ["Surviving fraction", "Oxygen concentration", "Time since treatment", "Absorbed dose in Gy"], 3, "The horizontal axis measures dose. Source: Week 12 study guide and lecture recap."], ["What does a surviving fraction of 0.01 represent?", ["0.01%", "10%", "1%", "0.1%"], 2, "Multiply a fraction by 100 to express it as a percentage. Source: Week 12 study guide and lecture recap."], ["Which effect does a cell survival curve primarily measure?", ["Immediate loss of cell membrane integrity", "Retention of reproductive capacity", "Increased cell size", "Time to oxygen fixation"], 1, "A surviving cell retains the capacity to reproduce. Source: Week 12 study guide and lecture recap."], ["Starting at 10% survival on the exponential portion, what survival is expected after one additional D0?", ["Approximately 3.7%", "37%", "0%", "Approximately 6.3%"], 0, "One D0 multiplies survival by approximately 0.37. Source: Week 12 study guide and lecture recap."], ["Which parameter is found by extending the terminal straight segment back to the vertical axis?", ["Dq", "D37", "OER", "Extrapolation number n"], 3, "The extrapolated vertical intercept gives n. Source: Week 12 study guide and lecture recap."], ["Which curve feature suggests greater capacity to repair sublethal damage?", ["A higher dose unit", "A steeper terminal segment by itself", "A broader shoulder", "A lower starting surviving fraction"], 2, "Dq describes shoulder width. Source: Week 12 study guide and lecture recap."], ["Which parameter gives the dose at 37% absolute survival?", ["Dq", "D37", "OER", "LET"], 1, "D37 is read at 0.37 on the survival axis. Source: Week 12 study guide and lecture recap."], ["If two curves have the same Dq, which feature can still differ?", ["Terminal slope", "Units on the dose axis", "The definition of a surviving cell", "The meaning of 100% survival"], 0, "Shoulder width and terminal slope describe different properties. Source: Week 12 study guide and lecture recap."], ["Why can zero survival not be placed on a logarithmic survival axis?", ["Zero represents 100% survival", "The dose units change at zero", "Zero only applies to high LET", "The logarithm of zero is undefined"], 3, "A logarithmic axis uses positive values. Source: Week 12 study guide and lecture recap."], ["Which reactive species from water radiolysis can attack DNA?", ["Molecular nitrogen", "Thymine", "Hydroxyl radical", "A phospholipid"], 2, "Hydroxyl radicals are reactive radiolysis products. Source: Week 12 study guide and lecture recap."], ["Which DNA damage is generally harder to repair correctly?", ["An isolated single-strand break", "Clustered double-strand breaks", "Normal DNA replication", "A reversible change in cell-cycle phase"], 1, "Nearby double-strand breaks create complex damage. Source: Week 12 study guide and lecture recap."], ["How can a ring chromosome contribute to reproductive failure?", ["It can interfere with chromosome segregation", "It restores blood flow", "It increases oxygen diffusion", "It widens the cell survival shoulder"], 0, "Abnormal segregation can lead to loss of genetic material. Source: Week 12 study guide and lecture recap."], ["Why does oxygen enhance low-LET DNA damage?", ["It stops water from absorbing radiation", "It prevents all indirect ionization", "It turns X-rays into high-LET radiation", "It helps make radical damage chemically persistent"], 3, "This is the oxygen fixation effect. Source: Week 12 study guide and lecture recap."], ["Which numerator is used in the OER formula?", ["Oxygenated dose for the same effect", "Survival after a single fraction", "Hypoxic dose for the same effect", "Time between fractions"], 2, "OER divides hypoxic dose by oxygenated dose. Source: Week 12 study guide and lecture recap."], ["What does an OER near 1 indicate?", ["Oxygen triples the dose needed", "Similar doses are needed with and without oxygen for the same effect", "Cells in all phases respond identically", "Radiation no longer damages DNA"], 1, "A ratio near 1 indicates little oxygen enhancement. Source: Week 12 study guide and lecture recap."], ["What happens to RBE beyond the approximate peak near 100 keV/µm?", ["It can decrease due to overkill", "It always increases linearly", "It becomes the same quantity as OER", "It measures dose rate instead"], 0, "Additional energy can exceed what is needed for the effect. Source: Week 12 study guide and lecture recap."], ["Which variable is a chemical influence on cell survival?", ["Dose rate", "Fraction size", "Cell-cycle phase", "Dissolved oxygen"], 3, "Oxygen alters the chemistry of radiation damage. Source: Week 12 study guide and lecture recap."], ["Which variable is a biological influence on cell survival?", ["Dose rate", "LET", "Cell-cycle phase", "Absorbed dose"], 2, "Cell-cycle phase affects how sensitive a cell is. Source: Week 12 study guide and lecture recap."], ["Which is an example of a vegetative intermitotic cell population?", ["Mature nondividing nerve cells", "Intestinal crypt cells", "Normally resting liver cells", "Highly differentiated muscle cells"], 1, "Intestinal crypt cells divide rapidly. Source: Week 12 study guide and lecture recap."], ["Which cell population is normally resting but can reenter division?", ["Reverting postmitotic", "Fixed postmitotic", "Vegetative intermitotic", "Differentiating intermitotic"], 0, "Liver cells are a course example of reverting postmitotic cells. Source: Week 12 study guide and lecture recap."], ["Which mature cell is a radiosensitive exception to the general rule about differentiation?", ["Nerve cell", "Muscle cell", "Fibroblast", "Lymphocyte"], 3, "Mature lymphocytes can be highly sensitive despite differentiation. Source: Week 12 study guide and lecture recap."], ["Why can radiation injury appear early in the intestinal lining?", ["The intestinal lining is fixed postmitotic", "The intestine cannot receive an absorbed dose", "Rapid turnover makes loss of replacement cells apparent quickly", "All intestinal cells are in late S phase"], 2, "A rapid replacement cycle makes depletion apparent sooner. Source: Week 12 study guide and lecture recap."], ["Which example describes tissue regeneration?", ["A scar replaces the original tissue", "Damaged cells are replaced by cells of the same type", "Oxygen fixes a DNA radical", "Surviving cells move into G2"], 1, "Regeneration restores the same tissue cell type. Source: Week 12 study guide and lecture recap."], ["Which is typically a later effect in the lung?", ["Fibrosis", "Immediate repopulation of the entire lung", "Erythema", "Cataract"], 0, "Fibrosis can develop months after exposure. Source: Week 12 study guide and lecture recap."], ["Which unit conversion is correct?", ["1 Gy = 10 cGy", "1 cGy = 100 Gy", "1 Gy = 1,000 cGy", "1 Gy = 100 cGy"], 3, "One gray contains one hundred centigray. Source: Week 12 study guide and lecture recap."], ["What value in Gy equals 300 cGy?", ["0.3 Gy", "30 Gy", "3 Gy", "300 Gy"], 2, "Divide centigray by 100 to obtain gray. Source: Week 12 study guide and lecture recap."], ["Which lecture association is listed for temporary xerostomia?", ["2–5 Gy", "20–30 Gy", "60–70 Gy", "65–75 Gy"], 1, "The lecture lists 20–30 Gy as a study association. Source: Week 12 study guide and lecture recap."], ["Which lecture association is listed for moist desquamation?", ["40 Gy", "10 Gy", "20 Gy", "70 Gy"], 0, "The lecture associates moist desquamation with 40 Gy. Source: Week 12 study guide and lecture recap."], ["Which lecture association is listed for permanent epilation?", ["5 Gy", "17.5 Gy", "20 Gy", "45 Gy"], 3, "The lecture lists 45 Gy for permanent epilation. Source: Week 12 study guide and lecture recap."], ["Which volume accompanies the historical skin TD 5/5 study entry?", ["10 cm²", "20 cm²", "100 cm²", "1 cm²"], 2, "The study table specifies a 100 cm² area for skin. Source: Week 12 study guide and lecture recap."]];
const storageKey = "radiation-biology-practice-100-v1";
const total = questions.length;
const byId = id => document.getElementById(id);
const validChoice = value => Number.isInteger(value) && value >= 0 && value < 4;

function loadProgress() {
  try {
    const stored = JSON.parse(localStorage.getItem(storageKey));
    if (stored && Number.isInteger(stored.index) && stored.index >= 0 && stored.index <= total &&
        Array.isArray(stored.answers) && stored.answers.length === total &&
        stored.answers.every(answer => answer === null || validChoice(answer)) &&
        stored.answers.slice(0, stored.index).every(validChoice)) {
      return stored;
    }
  } catch {
    // A missing, invalid, or unavailable save starts a fresh session.
  }
  return { index: 0, answers: Array(total).fill(null), draft: null };
}

let state = loadProgress();
let canSave = true;

function saveProgress() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(state));
    canSave = true;
  } catch {
    canSave = false;
  }
}

function render(focus = false) {
  const { index, answers, draft } = state;
  const finished = index === total;
  const answered = answers.filter(validChoice).length;
  byId("position").textContent = finished ? `${answered} of ${total} answered` : `Question ${index + 1} of ${total} · ${answered} answered`;
  byId("saved").textContent = canSave ? "Progress saved on this browser" : "Progress saving is unavailable in this browser";
  byId("progress").value = answered;
  byId("back").disabled = index === 0;
  const options = byId("options");
  const feedback = byId("feedback");
  const advance = byId("advance");
  const title = byId("question");
  options.replaceChildren();
  feedback.hidden = true;
  feedback.textContent = "";
  advance.hidden = finished;

  if (finished) {
    const score = answers.filter((answer, i) => answer === questions[i][2]).length;
    title.textContent = `Quiz complete · ${score} / ${total}`;
    byId("back").textContent = "Review answers";
  } else {
    byId("back").textContent = "Previous";
    const [prompt, choices, correct, explanation] = questions[index];
    const submitted = answers[index];
    const checked = validChoice(submitted);
    const selected = checked ? submitted : draft;
    title.textContent = prompt;
    choices.forEach((choice, i) => {
      const button = document.createElement("button");
      const letter = document.createElement("b");
      letter.textContent = "ABCD"[i];
      button.type = "button";
      button.className = "option";
      button.append(letter, document.createTextNode(choice));
      button.setAttribute("aria-pressed", i === selected);
      button.disabled = checked;
      if (checked && i === correct) button.classList.add("correct");
      if (checked && i === submitted && i !== correct) button.classList.add("incorrect");
      button.addEventListener("click", () => {
        state.draft = i;
        saveProgress();
        render();
        options.children[i].focus();
      });
      options.append(button);
    });
    if (checked) {
      feedback.hidden = false;
      feedback.textContent = submitted === correct ? `Correct. ${explanation}` :
        `Correct answer: ${"ABCD"[correct]}. ${choices[correct]}. ${explanation}`;
    }
    advance.disabled = !checked && !validChoice(selected);
    advance.textContent = checked ? (index === total - 1 ? "See score" : "Next question") : "Check answer";
  }
  if (focus) title.focus();
}

byId("advance").addEventListener("click", () => {
  const { index, answers, draft } = state;
  const checked = validChoice(answers[index]);
  if (checked) state.index++;
  else if (validChoice(draft)) answers[index] = draft;
  state.draft = null;
  saveProgress();
  render(checked);
});

byId("back").addEventListener("click", () => {
  state.index--;
  state.draft = null;
  saveProgress();
  render(true);
});

byId("restart").addEventListener("click", () => {
  if (!window.confirm("Clear your saved answers and start over?")) return;
  state = { index: 0, answers: Array(total).fill(null), draft: null };
  saveProgress();
  render(true);
});

saveProgress();
render();
</script>
